<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - Register | CampusBite</title>
    <link rel="stylesheet" href="student-register.css">
    <link rel="stylesheet" href="design-system.css?v=12">
</head>
<body>
    <div class="student-login-page">
        <div class="student-login-card">
            <div class="login-brand">
                <div class="login-brand">
                    <div class="logo">
                        Campus<span>Bite</span>
                    </div>
                    <div class="student-icon">
                        🎓
                    </div>
                </div>
                <h1>Create Account</h1>
                <p class="login-subtitle">
                    Create your CampusBite student account
                </p>
                <form id="student-register-form">
                    <div class="input-group">
                        <label for="student-name">
                            Full Name
                        </label>
                        <input
                        type="text"
                        id="student-name"
                        placeholder="Enter your full name"
                        required
                        >
                    </div>
                    <div class="input-group">
                        <label for="register-number">
                            Register Number
                        </label>
                        <input
                        type="text"
                        id="register-number"
                        placeholder="Enter your register number"
                        required
                        >
                    </div>
                    <div class="input-group">
                        <label fr="student-email">
                            College Email
                        </label>
                        <input
                        type="email"
                        id="student-email"
                        placeholder="Enter your college email"
                        required
                        >
                    </div>
                    <div class="input-group">
                        <label for="student-password">
                            Password
                        </label>
                        <div class="password-box">
                        <input
                        type="password"
                        id="student-password"
                        placeholder="Create a strong password"
                        required
                        >
                        <button type="button" class="eye-btn" onclick="togglePassword('student-password', this)">
                            👁️
                        </button>
                    </div>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>
                        <div class="password-box">
                        <input
                        type="password"
                        id="confirm-password"
                        placeholder="Re-enter your password"
                        required
                        >
                        <button type="button" class="eye-btn" onclick="togglePassword('confirm-password', this)">
                            👁️
                        </button>
                    </div>
                    </div>
                    <button type="submit" class="student-login-btn">
                        Create Account
                    </button>
                </form>
                <div class="register-link">
                    <p>
                        Already have an account?
                        <a href="student-login.html">Login</a>
                    </p>
                </div>
                <div class="back-login">
                    <a href="login.html">
                        <- Back to Role Selection
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="notification.js"></script>
    <script src="student-register.js"></script>
</body>
</html>

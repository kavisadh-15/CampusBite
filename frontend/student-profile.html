<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - CampusBite</title>

    <link rel="stylesheet" href="student-profile.css">
    <link rel="stylesheet" href="design-system.css?v=12">
</head>

<body>

    <div class="profile-page">

        <header class="profile-header">
            <div>
                <h1>My Profile</h1>
                <p>Manage your CampusBite account details.</p>
            </div>

            <a href="student-dashboard.html" class="back-btn">
                ← Dashboard
            </a>
        </header>


        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <div class="profile-info">

                <h2 id="profile-name">Student Name</h2>

                <p>
                    <span>🎓</span>
                    <span id="profile-register">Register Number</span>
                </p>

                <p>
                    <span>✉️</span>
                    <span id="profile-email">student@email.com</span>
                </p>

                <span class="profile-role">
                    Student
                </span>

            </div>

        </section>


        <section class="profile-details">

            <h2>Account Information</h2>

            <div class="detail-row">
                <span>Full Name</span>
                <strong id="detail-name">Student Name</strong>
            </div>

            <div class="detail-row">
                <span>Register Number</span>
                <strong id="detail-register">Register Number</strong>
            </div>

            <div class="detail-row">
                <span>Email</span>
                <strong id="detail-email">student@email.com</strong>
            </div>

            <div class="detail-row">
                <span>Account Type</span>
                <strong>Student</strong>
            </div>

        </section>

    </div>


    <script src="notification.js"></script>
    <script src="student-profile.js"></script>

</body>
</html>

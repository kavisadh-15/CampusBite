<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusBite</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="design-system.css?v=12">
</head>

<body>

    <div class="login-page">

        <div class="login-header">
            <div class="logo">
                Campus<span>Bite</span>
            </div>

            <p>Smart Canteen Management System</p>
        </div>

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to continue to CampusBite
            </p>

            <div class="role-cards">

                <div class="role-card">
                    <div class="role-icon">🎓</div>

                    <h3>Student</h3>

                    <p>
                        Order food, make payments and track your orders.
                    </p>

                    <a href="student-login.html" class="role-btn">
                        Continue as Student
                    </a>
                </div>

                <div class="role-card">
                    <div class="role-icon">🧑‍🍳</div>

                    <h3>Canteen Staff</h3>

                    <p>
                        Manage menu, orders and customer pickups.
                    </p>

                    <a href="staff-login.html" class="role-btn">
                        Continue as Staff
                    </a>
                </div>

            </div>

            <p class="back-home">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <script src="notification.js"></script>
    <script src="login.js"></script>

</body>
</html>

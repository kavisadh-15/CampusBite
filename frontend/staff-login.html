<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Staff Login | CampusBite</title>

<link
    rel="stylesheet"
    href="staff-login.css">
<link rel="stylesheet" href="design-system.css?v=12">

</head>

<body>

<div class="staff-login-page">

    <div class="staff-login-card">

        <div class="staff-login-icon">
            👨‍🍳
        </div>

        <h1>Staff Login</h1>

        <p class="staff-login-subtitle">
            Sign in to manage CampusBite operations.
        </p>

        <form id="staff-login-form">

            <div class="staff-input-group">

                <label for="staff-email">
                    Staff Email
                </label>

                <input
                    type="email"
                    id="staff-email"
                    placeholder="Enter your staff email"
                    required>

            </div>

            <div class="staff-input-group">

                <label for="staff-password">
                    Password
                </label>

                <div class="staff-password-box">

                    <input
                        type="password"
                        id="staff-password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        id="staff-password-toggle">
                        👁️
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="staff-login-btn">

                Login

            </button>

            <p
                id="staff-login-message"
                class="staff-login-message">
            </p>

        </form>

        <div class="staff-register-link">

            <span>
                Don't have a staff account?
            </span>

            <a href="staff-register.html">
                Register
            </a>

        </div>

        <a
            href="login.html"
            class="staff-back-link">

            ← Back to Login

        </a>

    </div>

</div>


<script src="notification.js"></script>
<script src="staff-login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | CampusBite</title>
    <link rel="stylesheet" href="student-login.css">
    <link rel="stylesheet" href="design-system.css?v=12">
</head>
<body>
    <div class="student-login-page">
        
        <div class="student-login-card">

            <div class="login-brand">
                <div class="logo">
                    Campus<span>Bite</span>
                </div>
                <div class="student-icon">
                    🎓
                </div>
            </div>
            <h1>Student Login</h1>
            <p class="login-subtitle">
                Login to your CampusBite student account
            </p>
            <form id="student-login-form">
                <div class="input-group">
                    <label for="register-number">
                        Register Number
                    </label>
                    <input
                    type="text"
                    id="register-number"
                    placeholder="Enter your register number"
                    required
                    >
                </div>
                <div class="input-group">
                    <label for="password">
                        Password
                    </label>
                    <div class="password-box">
                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    >
                    <button type="button" class="eye-btn" onclick="togglePassword('password', this)">

                    </button>
                </div>
                </div>
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">
                        Forget Password?
                    </a>
                </div>
                <button type="submit" class="student-login-btn">
                    Login
                </button>
            </form>
            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="student-register.html">Register</a>
                </p>
            </div>
            <div class="back-login">
                <a href="login.html">
                    <-Back to Role Selection
                </a>
            </div>
        </div>
    </div>
    <script src="notification.js"></script>
    <script src="student-login.js"></script>
</body>
</html>
